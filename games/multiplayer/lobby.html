<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Game Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #a0035c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .lobby-section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        input:focus {
            outline: none;
            border-color: #0066cc;
        }

        button {
            background: linear-gradient(45deg, #0066cc, #0088ff);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .room-code {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            color: #0066cc;
            letter-spacing: 5px;
            margin: 20px 0;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .players-list {
            list-style: none;
            margin-top: 15px;
        }

        .player-item {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            color: #333;
        }

        .host-badge {
            background: #0066cc;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="game-title">Multiplayer Game</h1>
        <p class="subtitle" id="game-subtitle">Connect with friends</p>

        <div id="status" class="status" style="display: none;"></div>

        <!-- Host Section -->
        <div id="host-section" class="lobby-section" style="display: none;">
            <h2 class="section-title">Create Room</h2>
            <input type="text" id="host-name" placeholder="Your name" maxlength="20">
            <button id="create-room-btn">Create Room</button>
        </div>

        <!-- Join Section -->
        <div id="join-section" class="lobby-section" style="display: none;">
            <h2 class="section-title">Join Room</h2>
            <input type="text" id="join-name" placeholder="Your name" maxlength="20">
            <input type="text" id="room-code-input" placeholder="Room Code" maxlength="4" style="text-transform: uppercase;">
            <button id="join-room-btn">Join Room</button>
        </div>

        <!-- Lobby Section -->
        <div id="lobby-section" class="lobby-section" style="display: none;">
            <h2 class="section-title">Room Code</h2>
            <div class="room-code" id="room-code-display"></div>
            
            <h2 class="section-title">Players</h2>
            <ul class="players-list" id="players-list"></ul>

            <div id="host-controls" style="display: none;">
                <button id="start-game-btn">Start Game</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="../../index.html" style="color: #0066cc; text-decoration: none;">← Back to Main Menu</a>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../config.js"></script>
    <script>
        // Get game type from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameType = urlParams.get('game') || 'reflex';

        // Backend configuration - use values from config.js
        // The config.js script should have already set window.BACKEND_URL
        const BACKEND_URL = window.BACKEND_URL || 
                           (window.location.hostname !== 'localhost' && 
                            window.location.hostname !== '127.0.0.1' &&
                            !window.location.hostname.startsWith('192.168.')
                            ? 'https://griffinhgames-server.fly.dev' 
                            : 'http://localhost:3000');

        // Initialize socket connection
        const socket = io(BACKEND_URL);

        let isHost = false;
        let currentRoomCode = null;
        let playerName = '';

        // UI Elements
        const hostSection = document.getElementById('host-section');
        const joinSection = document.getElementById('join-section');
        const lobbySection = document.getElementById('lobby-section');
        const statusEl = document.getElementById('status');
        const roomCodeDisplay = document.getElementById('room-code-display');
        const playersList = document.getElementById('players-list');
        const hostControls = document.getElementById('host-controls');

        // Show initial UI (host or join)
        function showInitialUI() {
            // For now, show both options. You can customize this
            hostSection.style.display = 'block';
            joinSection.style.display = 'block';
        }

        // Show status message
        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        // Create room
        document.getElementById('create-room-btn').addEventListener('click', () => {
            const name = document.getElementById('host-name').value.trim();
            if (!name) {
                showStatus('Please enter your name', 'error');
                return;
            }

            playerName = name;
            socket.emit('player:setName', name);
            socket.emit('host:createRoom', { gameType });
        });

        // Join room
        document.getElementById('join-room-btn').addEventListener('click', () => {
            const name = document.getElementById('join-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            
            if (!name) {
                showStatus('Please enter your name', 'error');
                return;
            }
            
            if (!code || code.length !== 4) {
                showStatus('Please enter a valid 4-character room code', 'error');
                return;
            }

            playerName = name;
            socket.emit('player:setName', name);
            socket.emit('player:joinRoom', { roomCode: code, name });
        });

        // Start game (host only)
        document.getElementById('start-game-btn').addEventListener('click', () => {
            socket.emit('host:startGame', { roomCode: currentRoomCode, gameType });
        });

        // Socket event handlers
        socket.on('connect', () => {
            console.log('Connected to server');
            showInitialUI();
        });

        socket.on('room:created', (roomState) => {
            isHost = true;
            currentRoomCode = roomState.code;
            hostSection.style.display = 'none';
            joinSection.style.display = 'none';
            lobbySection.style.display = 'block';
            hostControls.style.display = 'block';
            updateLobby(roomState);
            showStatus('Room created! Share the code with friends.', 'success');
        });

        socket.on('room:state', (roomState) => {
            updateLobby(roomState);
        });

        socket.on('room:error', (message) => {
            showStatus(message, 'error');
        });

        socket.on('game:started', (data) => {
            showStatus('Game starting!', 'success');
            
            // Redirect to the specific game page
            if (data.gameType === 'buzzin') {
                // Pass room code, player name, and host status
                const target = `../buzzin/index.html?room=${currentRoomCode}&name=${encodeURIComponent(playerName)}&host=${isHost}`;
                window.location.href = target;
            } else {
                alert(`Game started: ${data.gameType} (UI not implemented yet)`);
            }
        });

        socket.on('room:closed', () => {
            showStatus('Room was closed', 'error');
            lobbySection.style.display = 'none';
            showInitialUI();
        });

        function updateLobby(roomState) {
            roomCodeDisplay.textContent = roomState.code;
            playersList.innerHTML = '';
            
            roomState.players.forEach(player => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.innerHTML = `
                    <span class="player-name">${player.name}</span>
                    ${player.isHost ? '<span class="host-badge">Host</span>' : ''}
                `;
                playersList.appendChild(li);
            });
        }

        // Handle disconnect
        socket.on('disconnect', () => {
            showStatus('Disconnected from server', 'error');
        });
    </script>
</body>
</html>
