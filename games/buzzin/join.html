<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuzzIn! - Join Game</title>
    <link rel="stylesheet" href="buzzin.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .join-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 3vw, 20px);
            box-sizing: border-box;
        }

        .join-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: clamp(30px, 5vw, 50px);
            max-width: min(500px, 95vw);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            margin: auto;
            text-align: center;
        }

        .join-title {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            margin-bottom: clamp(10px, 2vw, 15px);
            background: linear-gradient(to right, #ff0055, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .join-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            margin-bottom: clamp(25px, 5vw, 40px);
        }

        .input-group {
            margin-bottom: clamp(15px, 3vw, 20px);
            text-align: left;
        }

        .input-group label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: clamp(6px, 1.5vw, 8px);
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .input-group input {
            width: 100%;
            padding: clamp(14px, 3.5vw, 18px);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: clamp(1.1rem, 3.5vw, 1.3rem);
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.15);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .room-code-input {
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 700;
            font-size: clamp(1.5rem, 5vw, 2rem) !important;
        }

        .btn-join {
            width: 100%;
            padding: clamp(16px, 4vw, 20px);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 800;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: white;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0,212,255,0.4);
            box-sizing: border-box;
            margin-top: clamp(10px, 2vw, 15px);
        }

        .btn-join:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(0,212,255,0.5);
        }

        .btn-join:active {
            transform: scale(0.98);
        }

        .btn-join:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        .input-group input.shake {
            animation: shake 0.5s ease-in-out;
            border-color: var(--danger, #ff3333) !important;
        }

        .back-link {
            display: inline-block;
            margin-top: clamp(20px, 4vw, 30px);
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .rejoin-section {
            margin-top: 20px;
            text-align: center;
        }

        .rejoin-divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .rejoin-divider::before,
        .rejoin-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .rejoin-divider span {
            padding: 0 15px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .btn-rejoin {
            width: 100%;
            padding: clamp(12px, 3vw, 15px);
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 700;
            border: 2px solid var(--accent, #00d4ff);
            border-radius: 50px;
            background: transparent;
            color: var(--accent, #00d4ff);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-rejoin:hover {
            background: var(--accent, #00d4ff);
            color: #1a1a2e;
        }

        .rejoin-info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }

        .hidden {
            display: none !important;
        }

        .connecting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .connecting-overlay.show {
            display: flex;
        }

        .connecting-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="join-container">
        <div class="join-card">
            <h1 class="join-title">Join Game</h1>
            <p class="join-subtitle">Enter the room code to join a BuzzIn! game</p>

            <div class="error-message" id="error-message"></div>

            <div class="input-group">
                <label for="player-name">Your Name</label>
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="room-code">Room Code</label>
                <input type="text" id="room-code" class="room-code-input" placeholder="----" maxlength="4" autocomplete="off">
            </div>

            <button id="btn-join" class="btn-join">Join Game</button>

            <div id="rejoin-section" class="rejoin-section hidden">
                <div class="rejoin-divider">
                    <span>or</span>
                </div>
                <button id="btn-rejoin" class="btn-rejoin">Rejoin Previous Game</button>
                <p id="rejoin-info" class="rejoin-info"></p>
            </div>

            <a href="../../index.html" class="back-link">Back to Main Menu</a>
        </div>
    </div>

    <div class="connecting-overlay" id="connecting-overlay">
        <div class="connecting-content">
            <div class="spinner"></div>
            <p>Joining game...</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../config.js"></script>
    <script>
        const backendUrl = window.BACKEND_URL || 'http://localhost:3000';
        const socket = io(backendUrl, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });

        const nameInput = document.getElementById('player-name');
        const codeInput = document.getElementById('room-code');
        const btnJoin = document.getElementById('btn-join');
        const errorEl = document.getElementById('error-message');
        const connectingOverlay = document.getElementById('connecting-overlay');

        // Auto-uppercase room code
        codeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        // Allow Enter key to submit
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') codeInput.focus();
        });

        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnJoin.click();
        });

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }

        function showConnecting(show) {
            if (show) {
                connectingOverlay.classList.add('show');
            } else {
                connectingOverlay.classList.remove('show');
            }
        }

        btnJoin.addEventListener('click', () => {
            const playerName = nameInput.value.trim();
            const roomCode = codeInput.value.trim().toUpperCase();

            // Validate name
            if (!playerName) {
                showError('Please enter your name');
                shakeInput(nameInput);
                nameInput.focus();
                return;
            }

            // Validate room code - empty
            if (!roomCode) {
                showError('Please enter a room code');
                shakeInput(codeInput);
                codeInput.focus();
                return;
            }

            // Validate room code - wrong length
            if (roomCode.length !== 4) {
                showError('Room code must be 4 characters');
                shakeInput(codeInput);
                codeInput.focus();
                return;
            }

            btnJoin.disabled = true;
            showConnecting(true);

            // Set name and join room
            socket.emit('player:setName', playerName);
            socket.emit('player:joinRoom', { roomCode: roomCode, name: playerName });
        });

        function shakeInput(inputEl) {
            inputEl.classList.add('shake');
            setTimeout(() => inputEl.classList.remove('shake'), 500);
        }

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        // Check URL for pre-filled room code (for easy rejoin via shared link)
        const urlParams = new URLSearchParams(window.location.search);
        const prefilledRoom = urlParams.get('room');
        const prefilledName = urlParams.get('name');

        if (prefilledRoom) {
            codeInput.value = prefilledRoom.toUpperCase();
        }
        if (prefilledName) {
            nameInput.value = prefilledName;

            // If both are provided, show quick rejoin option
            if (prefilledRoom) {
                const rejoinSection = document.getElementById('rejoin-section');
                const rejoinInfo = document.getElementById('rejoin-info');
                const btnRejoin = document.getElementById('btn-rejoin');

                rejoinSection.classList.remove('hidden');
                rejoinInfo.textContent = `Rejoin as: ${prefilledName}`;

                btnRejoin.addEventListener('click', () => {
                    btnRejoin.disabled = true;
                    showConnecting(true);

                    socket.emit('player:setName', prefilledName);
                    socket.emit('player:joinRoom', {
                        roomCode: prefilledRoom.toUpperCase(),
                        name: prefilledName,
                        isHost: false
                    });
                });
            }
        }

        socket.on('connect_error', (error) => {
            showConnecting(false);
            btnJoin.disabled = false;
            showError('Unable to connect to server. Please try again.');
        });

        socket.on('room:state', (roomState) => {
            // Successfully joined - redirect to game page
            const playerName = nameInput.value.trim();
            const roomCode = codeInput.value.trim().toUpperCase();

            // Store redirect info in sessionStorage (will be read by game page)
            sessionStorage.setItem('buzzin_redirect', JSON.stringify({
                room: roomCode,
                name: playerName,
                host: false
            }));

            // Redirect to game page with params in URL (for reconnection via URL)
            const target = `index.html?room=${roomCode}&name=${encodeURIComponent(playerName)}&host=false`;
            window.location.replace(target);
        });

        socket.on('room:error', (message) => {
            showConnecting(false);
            btnJoin.disabled = false;

            // Re-enable rejoin button if it exists
            const btnRejoin = document.getElementById('btn-rejoin');
            if (btnRejoin) btnRejoin.disabled = false;

            // Show appropriate error message
            if (message.includes('not found') || message.includes('Invalid')) {
                showError('Room not found. The game may have ended.');
                shakeInput(codeInput);
                // Hide rejoin section since room is gone
                const rejoinSection = document.getElementById('rejoin-section');
                if (rejoinSection) rejoinSection.classList.add('hidden');
            } else {
                showError(message);
            }
        });

        socket.on('game:started', (data) => {
            // Game already started, redirect to game page
            const playerName = nameInput.value.trim();
            const roomCode = codeInput.value.trim().toUpperCase();

            sessionStorage.setItem('buzzin_redirect', JSON.stringify({
                room: roomCode,
                name: playerName,
                host: false
            }));

            const target = `index.html?room=${roomCode}&name=${encodeURIComponent(playerName)}&host=false`;
            window.location.replace(target);
        });
    </script>
</body>
</html>
