<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKED IN - Game Setup</title>
    <link rel="stylesheet" href="buzzin.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap');

        html {
            min-height: 100%;
            background: #16213e;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1e 100%) fixed;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 0, 85, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .setup-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 3vw, 32px);
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .setup-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: clamp(20px, 3vw, 32px);
            width: 100%;
            max-width: 1040px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        /* Header: title left, name on the right */
        .setup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .setup-title {
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #ff0055, #ffcc00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            white-space: nowrap;
        }

        .name-input-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 1 360px;
        }

        .name-input-section label {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .name-input-section input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .name-input-section input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.13);
        }

        .name-input-section input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        /* Two-column body */
        .setup-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px 28px;
        }

        .setup-section h3 {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 0 10px;
        }

        .setup-section + .setup-section {
            margin-top: 18px;
        }

        /* Categories: compact chips (scoped so the in-game grid is unaffected) */
        .categories-section {
            margin-bottom: 20px;
        }

        .setup-card .category-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin: 0;
            max-width: none;
        }

        .setup-card .category-checkbox {
            padding: 9px 11px;
            gap: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
        }

        .setup-card .category-checkbox:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .setup-card .category-checkbox input[type="checkbox"] {
            width: 17px;
            height: 17px;
        }

        .setup-card .category-checkbox span {
            font-size: 0.88rem;
            line-height: 1.25;
        }

        /* Sliders: 2x2 tiles with the value inline */
        .slider-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .slider-tile {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 11px 13px 13px;
        }

        .slider-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 9px;
        }

        .slider-head label {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
        }

        .question-count-display {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }

        .question-count-display span {
            font-size: 1.15rem;
            font-weight: 800;
            color: white;
        }

        .slider-tile input[type="range"] {
            width: 100%;
            height: 6px;
            margin: 0;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-tile input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .slider-tile input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        /* Game options: 2-column toggles with a short hint line */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .option-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .option-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .option-toggle input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin: 0;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--primary, #ff0055);
        }

        .option-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .option-text strong {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .option-text small {
            font-size: 0.74rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.3;
        }

        /* Footer */
        .setup-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .btn-create-room {
            min-width: 260px;
            padding: 14px 32px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff0055, #ff4444);
            color: white;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-create-room:hover {
            transform: scale(1.02);
        }

        .btn-create-room:active {
            transform: scale(0.98);
        }

        .btn-create-room:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        /* Tablet and phone: stack into one column */
        @media (max-width: 860px) {
            .setup-body {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 600px) {
            .setup-header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            .setup-title {
                text-align: center;
            }

            .name-input-section {
                flex: none;
            }

            .setup-card .category-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .options-grid,
            .slider-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .setup-footer {
                flex-direction: column-reverse;
            }

            .btn-create-room {
                width: 100%;
                min-width: 0;
            }
        }

    </style>
    <link rel="stylesheet" href="/assets/help/help.css">
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-header">
                <h1 class="setup-title">LOCKED IN Setup</h1>
                <div class="name-input-section">
                    <label for="host-name">Your Name</label>
                    <input type="text" id="host-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
                </div>
            </div>

            <div class="error-message" id="error-message"></div>

            <div class="setup-section categories-section">
                <h3>Categories</h3>
                <div id="category-checkboxes" class="category-grid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="setup-body">
                <div class="setup-column">
                    <div class="setup-section">
                        <h3>Questions &amp; Timers</h3>
                        <div class="slider-grid">
                            <div class="slider-tile">
                                <div class="slider-head">
                                    <label for="q-count-slider">Questions</label>
                                    <div class="question-count-display"><span id="q-count-display">10</span> total</div>
                                </div>
                                <input type="range" id="q-count-slider" min="5" max="100" value="10" step="1">
                            </div>
                            <div class="slider-tile">
                                <div class="slider-head">
                                    <label for="otd-count-slider">OFF THE DOME</label>
                                    <div class="question-count-display"><span id="otd-count-display">3</span> free-text</div>
                                </div>
                                <input type="range" id="otd-count-slider" min="0" max="10" value="3" step="1">
                            </div>
                            <div class="slider-tile">
                                <div class="slider-head">
                                    <label for="timer-slider">Answer timer</label>
                                    <div class="question-count-display"><span id="timer-display">30</span> sec</div>
                                </div>
                                <input type="range" id="timer-slider" min="5" max="120" value="30" step="5">
                            </div>
                            <div class="slider-tile">
                                <div class="slider-head">
                                    <label for="otd-timer-slider">OTD timer</label>
                                    <div class="question-count-display"><span id="otd-timer-display">60</span> sec</div>
                                </div>
                                <input type="range" id="otd-timer-slider" min="10" max="180" value="60" step="5">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="setup-column">
                    <div class="setup-section">
                        <h3>Game Options</h3>
                        <div class="options-grid">
                            <label class="option-toggle">
                                <input type="checkbox" id="bonus-points-toggle" checked>
                                <span class="option-text"><strong>First-answer bonus</strong><small>+50 for the first correct answer</small></span>
                            </label>
                            <label class="option-toggle">
                                <input type="checkbox" id="host-plays-toggle" checked>
                                <span class="option-text"><strong>Host plays too</strong><small>Uncheck to spectate as admin</small></span>
                            </label>
                            <label class="option-toggle">
                                <input type="checkbox" id="countdown-toggle" checked>
                                <span class="option-text"><strong>3-2-1 countdown</strong><small>Between questions</small></span>
                            </label>
                            <label class="option-toggle">
                                <input type="checkbox" id="hard-mode-toggle">
                                <span class="option-text"><strong>Hard mode</strong><small>Harder question set</small></span>
                            </label>
                            <label class="option-toggle">
                                <input type="checkbox" id="otd-at-end-toggle" checked>
                                <span class="option-text"><strong>Mix in OFF THE DOME</strong><small>Uncheck to save for the end</small></span>
                            </label>
                            <label class="option-toggle">
                                <input type="checkbox" id="show-otd-category-toggle" checked>
                                <span class="option-text"><strong>Show OTD category</strong><small>Next to the OTD badge</small></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="setup-footer">
                <a href="../../index.html" class="back-link">← Back to Main Menu</a>
                <button id="btn-create-room" class="btn-create-room">Create Room</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../config.js"></script>
    <script>
        const CATEGORIES = [
            "General Knowledge",
            "Science",
            "Movies & TV",
            "Music",
            "Sports",
            "History",
            "Geography",
            "Pop Culture",
            "Games",
            "Random",
            "Flags"
        ];
        
        const backendUrl = window.BACKEND_URL || 'http://localhost:3000';
        const socket = io(backendUrl, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });
        
        let hostName = '';
        let selectedCategories = [];
        let questionCount = 10;
        let timerDuration = 30;
        let otdTimerDuration = 60;
        let offTheDomeCount = 3;
        let availableQuestions = 0; // Will be calculated based on categories
        
        // Initialize category checkboxes
        const categoryContainer = document.getElementById('category-checkboxes');
        categoryContainer.innerHTML = CATEGORIES.map(cat => `
            <label class="category-checkbox">
                <input type="checkbox" value="${cat}" checked>
                <span>${cat}</span>
            </label>
        `).join('');
        
        // Question counts per category — fetched from server so they stay in sync
        let CATEGORY_QUESTION_COUNTS = {};
        let MAX_QUESTIONS_PER_GAME = 100; // Server-enforced cap; updated from API response

        async function fetchCategoryCounts() {
            try {
                const res = await fetch(`${backendUrl}/buzzin/category-counts`);
                if (res.ok) {
                    const data = await res.json();
                    // Pull the server's cap before storing counts
                    if (typeof data._maxPerGame === 'number') {
                        MAX_QUESTIONS_PER_GAME = data._maxPerGame;
                        delete data._maxPerGame;
                    }
                    CATEGORY_QUESTION_COUNTS = data;
                }
            } catch (e) {
                // Fall back to defaults if fetch fails
                CATEGORIES.forEach(c => { CATEGORY_QUESTION_COUNTS[c] = 25; });
            }
            updateQuestionCountLimits();
        }

        function calculateAvailableQuestions() {
            return selectedCategories.reduce((sum, cat) => sum + (CATEGORY_QUESTION_COUNTS[cat] || 25), 0);
        }

        function updateQuestionCountLimits() {
            availableQuestions = calculateAvailableQuestions();
            const slider = document.getElementById('q-count-slider');
            const currentValue = parseInt(slider.value);

            // Slider max = lesser of available questions and the server's hard cap (100)
            const sliderMax = Math.min(availableQuestions, MAX_QUESTIONS_PER_GAME);
            slider.max = sliderMax;

            // If current value exceeds max, clamp it
            if (currentValue > sliderMax) {
                slider.value = sliderMax;
            }
            // Read the value back: the browser also keeps it within min..max,
            // so the count always matches what the slider shows
            questionCount = parseInt(slider.value);

            // Update display
            const display = document.getElementById('q-count-display');
            display.textContent = questionCount;
            display.parentElement.style.color = 'white';

            // Keep OTD slider max in sync with question count
            updateOtdMax();
        }
        
        // OTD slider helpers
        const otdSlider = document.getElementById('otd-count-slider');
        const otdDisplay = document.getElementById('otd-count-display');

        function updateOtdMax() {
            otdSlider.max = questionCount;
            if (offTheDomeCount > questionCount) {
                offTheDomeCount = questionCount;
                otdSlider.value = questionCount;
                otdDisplay.textContent = questionCount;
            }
        }

        otdSlider.addEventListener('input', (e) => {
            offTheDomeCount = parseInt(e.target.value);
            otdDisplay.textContent = offTheDomeCount;
        });

        // Question count slider
        const qCountSlider = document.getElementById('q-count-slider');
        const qCountDisplay = document.getElementById('q-count-display');
        qCountSlider.addEventListener('input', (e) => {
            questionCount = parseInt(e.target.value);
            qCountDisplay.textContent = questionCount;
            updateQuestionCountLimits();
            updateOtdMax();
        });

        // Timer duration slider
        const timerSlider = document.getElementById('timer-slider');
        const timerDisplay = document.getElementById('timer-display');
        timerSlider.addEventListener('input', (e) => {
            timerDuration = parseInt(e.target.value);
            timerDisplay.textContent = timerDuration;
        });

        // OTD timer slider
        const otdTimerSlider = document.getElementById('otd-timer-slider');
        const otdTimerDisplay = document.getElementById('otd-timer-display');
        otdTimerSlider.addEventListener('input', (e) => {
            otdTimerDuration = parseInt(e.target.value);
            otdTimerDisplay.textContent = otdTimerDuration;
        });
        
        // Update selected categories
        categoryContainer.addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') {
                selectedCategories = Array.from(categoryContainer.querySelectorAll('input:checked'))
                    .map(cb => cb.value);
                updateQuestionCountLimits();
            }
        });
        
        // Initialize selected categories and fetch live counts from server
        selectedCategories = CATEGORIES;
        fetchCategoryCounts();
        
        // Toggle name field requirement based on host-plays-toggle
        const hostPlaysToggle = document.getElementById('host-plays-toggle');
        const hostNameInput = document.getElementById('host-name');
        hostPlaysToggle.addEventListener('change', () => {
            if (!hostPlaysToggle.checked) {
                hostNameInput.placeholder = 'Admin (optional)';
            } else {
                hostNameInput.placeholder = 'Enter your name';
            }
        });

        // Create room button
        const btnCreateRoom = document.getElementById('btn-create-room');
        btnCreateRoom.addEventListener('click', () => {
            const nameInput = document.getElementById('host-name');
            const hostPlays = document.getElementById('host-plays-toggle')?.checked === true;
            hostName = nameInput.value.trim() || (hostPlays ? '' : 'Admin');

            if (!hostName) {
                showError('Please enter your name');
                return;
            }
            
            if (selectedCategories.length === 0) {
                showError('Please select at least one category');
                return;
            }
            
            // Validate question count
            if (questionCount < 5) {
                showError('Please select at least 5 questions');
                return;
            }
            
            // Disable button to prevent double-clicks
            btnCreateRoom.disabled = true;
            btnCreateRoom.textContent = 'Creating Room...';
            
            // Store settings in sessionStorage
            const bonusFirstCorrect = document.getElementById('bonus-points-toggle')?.checked !== false;
            const hostAsPlayer = document.getElementById('host-plays-toggle')?.checked === true;
            const countdownEnabled = document.getElementById('countdown-toggle')?.checked !== false;
            const otdAtEnd = document.getElementById('otd-at-end-toggle')?.checked === false;
            const showOtdCategory = document.getElementById('show-otd-category-toggle')?.checked !== false;
            const hardMode = document.getElementById('hard-mode-toggle')?.checked === true;
            sessionStorage.setItem('buzzin_settings', JSON.stringify({
                categories: selectedCategories,
                questionCount: questionCount,
                timerDuration: timerDuration,
                otdTimerDuration: otdTimerDuration,
                hostName: hostName,
                bonusFirstCorrect: bonusFirstCorrect,
                hostAsPlayer: hostAsPlayer,
                offTheDomeCount: offTheDomeCount,
                countdownEnabled: countdownEnabled,
                otdAtEnd: otdAtEnd,
                showOtdCategory: showOtdCategory,
                hardMode: hardMode
            }));

            // Wait for socket to be connected before creating room
            if (socket.connected) {
                createRoom();
            } else {
                // Wait for connection
                socket.once('connect', () => {
                    createRoom();
                });
                socket.connect();
            }
        });
        
        function createRoom() {
            // Set name and create room
            socket.emit('player:setName', hostName);
            socket.emit('host:createRoom', { gameType: 'buzzin' });
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }
        
        socket.on('connect', () => {
            console.log('Connected to server');
            // Clear any error messages on successful connection
            const errorEl = document.getElementById('error-message');
            if (errorEl && errorEl.classList.contains('show')) {
                errorEl.classList.remove('show');
            }
        });
        
        socket.on('disconnect', () => {
            // Don't show error immediately - might be reconnecting
            console.log('Disconnected from server');
        });
        
        socket.on('reconnect', () => {
            console.log('Reconnected to server');
        });
        
        socket.on('connect_error', (error) => {
            showError('Connection error. Please check your connection.');
            // Re-enable button if connection fails
            btnCreateRoom.disabled = false;
            btnCreateRoom.textContent = 'Create Room';
        });
        
        socket.on('room:created', (roomState) => {
            // Store game settings for when game starts (already saved above, update with same values)
            sessionStorage.setItem('buzzin_settings', JSON.stringify({
                categories: selectedCategories,
                questionCount: questionCount,
                timerDuration: timerDuration,
                otdTimerDuration: otdTimerDuration,
                hostName: hostName,
                bonusFirstCorrect: document.getElementById('bonus-points-toggle')?.checked !== false,
                hostAsPlayer: document.getElementById('host-plays-toggle')?.checked === true,
                offTheDomeCount: offTheDomeCount,
                countdownEnabled: document.getElementById('countdown-toggle')?.checked !== false,
                otdAtEnd: document.getElementById('otd-at-end-toggle')?.checked === false,
                showOtdCategory: document.getElementById('show-otd-category-toggle')?.checked !== false,
                hardMode: document.getElementById('hard-mode-toggle')?.checked === true
            }));

            // Store redirect info for the game page
            sessionStorage.setItem('buzzin_redirect', JSON.stringify({
                room: roomState.code,
                name: hostName,
                host: true,
                handoffToken: roomState.handoffToken
            }));

            // Redirect to game page — room code in URL, host identity only in sessionStorage
            // (never put host=true in the URL — anyone can copy/type that to spoof controls)
            const gameUrl = `index.html?room=${roomState.code}&name=${encodeURIComponent(hostName)}`;
            window.location.replace(gameUrl);
        });
        
        socket.on('room:error', (message) => {
            showError(message);
            // Re-enable button on error
            btnCreateRoom.disabled = false;
            btnCreateRoom.textContent = 'Create Room';
        });
    </script>
    <template id="help-template" data-theme="lockedin" data-title="Hosting LOCKED IN">
        <h3>Getting started</h3>
        <ol>
            <li>Put this screen on a TV or laptop everyone can see. It shows the room code, timer, and scoreboard.</li>
            <li>Pick your categories and settings, then <strong>Create Room</strong>.</li>
            <li>Players open the site on their phones, tap <strong>LOCKED IN &rarr; Player</strong>, and enter the room code.</li>
            <li>When everyone's in, press <strong>Start Game</strong>.</li>
        </ol>
        <h3>Running a round</h3>
        <ul>
            <li>Press <strong>Start Round</strong> to show the first question, then <strong>Next Question</strong> after each result.</li>
            <li>Players tap an answer on their phone before the timer runs out.</li>
            <li>A correct answer is worth <span class="help-chip">100</span>, and the first correct answer gets <span class="help-chip">+50</span> if the bonus is on.</li>
            <li>After each round everyone sees the answer, a short explanation, and the standings.</li>
        </ul>
        <h3>OFF THE DOME</h3>
        <p>Free-text questions with no choices. Answers are graded by AI, so typos and alternate spellings still count. Choose how many to include, give them their own timer, and mix them in or save them for the end.</p>
        <h3>Settings on this page</h3>
        <ul>
            <li><strong>Host plays too</strong>: you answer questions on this screen like everyone else. Uncheck it to just run the game; your screen then shows the timer, who has answered, and the scoreboard, while questions appear on players' phones (needs at least 2 players).</li>
            <li><strong>3-2-1 countdown</strong>: a short countdown before each question.</li>
            <li><strong>Hard mode</strong>: pulls from a tougher question set.</li>
            <li><strong>Show OTD category</strong>: shows the category next to the OFF THE DOME badge.</li>
        </ul>
        <h3>Host controls in the game</h3>
        <p>Open the <strong>&#9776; Admin</strong> menu in the top-right corner during a game to:</p>
        <ul>
            <li><strong>Kick</strong> a player</li>
            <li><strong>Shuffle</strong> the remaining questions</li>
            <li><strong>Flag</strong> a bad question (that round won't count)</li>
            <li><strong>Pause</strong> and resume</li>
            <li>Start a <strong>new game</strong> or <strong>end</strong> the game</li>
        </ul>
        <p>Turn music on or off from the lobby. At the end, <strong>Play Again</strong> keeps the same players and lets you change settings.</p>
        <h3>If you get disconnected</h3>
        <p>Rejoin with the same name and you'll get host back. If you leave for good, another player takes over as host.</p>
    </template>
