<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKED IN - Game Setup</title>
    <link rel="stylesheet" href="buzzin.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        html {
            min-height: 100%;
            background: #16213e;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1e 100%);
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 0, 85, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .setup-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(15px, 4vw, 30px);
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        
        .setup-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: clamp(20px, 5vw, 40px);
            max-width: min(600px, 95vw);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            margin: auto;
        }
        
        .setup-title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 30px);
            background: linear-gradient(to right, #ff0055, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        
        .name-input-section {
            margin-bottom: clamp(20px, 4vw, 30px);
        }
        
        .name-input-section label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: clamp(8px, 2vw, 10px);
            font-size: clamp(1rem, 3vw, 1.1rem);
        }
        
        .name-input-section input {
            width: 100%;
            padding: clamp(12px, 3vw, 15px);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        
        .name-input-section input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.15);
        }
        
        .name-input-section input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        .setup-section {
            margin-bottom: clamp(20px, 4vw, 30px);
        }
        
        .setup-section h3 {
            color: white;
            font-size: clamp(1rem, 3vw, 1.2rem);
            margin-bottom: clamp(10px, 2vw, 15px);
        }
        
        .question-count-control {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        
        .question-count-control input[type="range"] {
            width: 100%;
            max-width: 400px;
            height: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        .question-count-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }
        
        .question-count-display {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 600;
            color: white;
        }
        
        .btn-create-room {
            width: 100%;
            padding: clamp(15px, 4vw, 18px);
            font-size: clamp(1.1rem, 3.5vw, 1.3rem);
            font-weight: 800;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff0055, #ff4444);
            color: white;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .btn-create-room:hover {
            transform: scale(1.02);
        }
        
        .btn-create-room:active {
            transform: scale(0.98);
        }
        
        .btn-create-room:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            color: #ffcccc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }

        .option-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 500;
            transition: background 0.2s;
            user-select: none;
        }

        .option-toggle:hover {
            background: rgba(255,255,255,0.14);
        }

        .option-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--primary, #ff0055);
        }

        .back-link {
            display: inline-block;
            margin-top: clamp(20px, 4vw, 30px);
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <h1 class="setup-title">LOCKED IN Setup</h1>
            
            <div class="error-message" id="error-message"></div>
            
            <div class="name-input-section">
                <label for="host-name">Your Name</label>
                <input type="text" id="host-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
            </div>
            
            <div class="setup-section">
                <h3>Select Categories:</h3>
                <div id="category-checkboxes" class="category-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
            
            <div class="setup-section">
                <h3>Number of Questions:</h3>
                <div class="question-count-control">
                    <input type="range" id="q-count-slider" min="5" max="100" value="10" step="1">
                    <div class="question-count-display">
                        <span id="q-count-display">10</span> questions
                    </div>
                </div>
            </div>

            <div class="setup-section">
                <h3>OFF THE DOME Questions:</h3>
                <div class="question-count-control">
                    <input type="range" id="otd-count-slider" min="0" max="10" value="3" step="1">
                    <div class="question-count-display">
                        <span id="otd-count-display">3</span> free-text questions
                    </div>
                </div>
            </div>

            <div class="setup-section">
                <h3>Answer Timer:</h3>
                <div class="question-count-control">
                    <input type="range" id="timer-slider" min="5" max="120" value="30" step="5">
                    <div class="question-count-display">
                        <span id="timer-display">30</span> seconds per question
                    </div>
                </div>
            </div>

            <div class="setup-section">
                <h3>Game Options:</h3>
                <label class="option-toggle">
                    <input type="checkbox" id="bonus-points-toggle" checked>
                    <span>First correct answer gets +50 bonus points</span>
                </label>
                <label class="option-toggle">
                    <input type="checkbox" id="host-plays-toggle" checked>
                    <span>Host plays as a player (uncheck to spectate / admin only)</span>
                </label>
                <label class="option-toggle">
                    <input type="checkbox" id="countdown-toggle" checked>
                    <span>3-2-1 countdown between questions</span>
                </label>
            </div>

            <button id="btn-create-room" class="btn-create-room">Create Room</button>

            <a href="../../index.html" class="back-link">Back to Main Menu</a>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../config.js"></script>
    <script>
        const CATEGORIES = [
            "General Knowledge",
            "Science",
            "Movies & TV",
            "Music",
            "Sports",
            "History",
            "Geography",
            "Pop Culture",
            "Games",
            "Random"
        ];
        
        const backendUrl = window.BACKEND_URL || 'http://localhost:3000';
        const socket = io(backendUrl, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });
        
        let hostName = '';
        let selectedCategories = [];
        let questionCount = 10;
        let timerDuration = 30;
        let offTheDomeCount = 3;
        let availableQuestions = 0; // Will be calculated based on categories
        
        // Initialize category checkboxes
        const categoryContainer = document.getElementById('category-checkboxes');
        categoryContainer.innerHTML = CATEGORIES.map(cat => `
            <label class="category-checkbox">
                <input type="checkbox" value="${cat}" checked>
                <span>${cat}</span>
            </label>
        `).join('');
        
        // Question counts per category — fetched from server so they stay in sync
        let CATEGORY_QUESTION_COUNTS = {};
        let MAX_QUESTIONS_PER_GAME = 100; // Server-enforced cap; updated from API response

        async function fetchCategoryCounts() {
            try {
                const res = await fetch(`${backendUrl}/buzzin/category-counts`);
                if (res.ok) {
                    const data = await res.json();
                    // Pull the server's cap before storing counts
                    if (typeof data._maxPerGame === 'number') {
                        MAX_QUESTIONS_PER_GAME = data._maxPerGame;
                        delete data._maxPerGame;
                    }
                    CATEGORY_QUESTION_COUNTS = data;
                }
            } catch (e) {
                // Fall back to defaults if fetch fails
                CATEGORIES.forEach(c => { CATEGORY_QUESTION_COUNTS[c] = 25; });
            }
            updateQuestionCountLimits();
        }

        function calculateAvailableQuestions() {
            return selectedCategories.reduce((sum, cat) => sum + (CATEGORY_QUESTION_COUNTS[cat] || 25), 0);
        }

        function updateQuestionCountLimits() {
            availableQuestions = calculateAvailableQuestions();
            const slider = document.getElementById('q-count-slider');
            const currentValue = parseInt(slider.value);

            // Slider max = lesser of available questions and the server's hard cap (100)
            const sliderMax = Math.min(availableQuestions, MAX_QUESTIONS_PER_GAME);
            slider.max = sliderMax;

            // If current value exceeds max, clamp it
            if (currentValue > sliderMax) {
                slider.value = sliderMax;
                questionCount = sliderMax;
                document.getElementById('q-count-display').textContent = sliderMax;
            }

            // Update display
            const display = document.getElementById('q-count-display');
            display.textContent = questionCount;
            display.parentElement.style.color = 'white';

            // Keep OTD slider max in sync with question count
            updateOtdMax();
        }
        
        // OTD slider helpers
        const otdSlider = document.getElementById('otd-count-slider');
        const otdDisplay = document.getElementById('otd-count-display');

        function updateOtdMax() {
            otdSlider.max = questionCount;
            if (offTheDomeCount > questionCount) {
                offTheDomeCount = questionCount;
                otdSlider.value = questionCount;
                otdDisplay.textContent = questionCount;
            }
        }

        otdSlider.addEventListener('input', (e) => {
            offTheDomeCount = parseInt(e.target.value);
            otdDisplay.textContent = offTheDomeCount;
        });

        // Question count slider
        const qCountSlider = document.getElementById('q-count-slider');
        const qCountDisplay = document.getElementById('q-count-display');
        qCountSlider.addEventListener('input', (e) => {
            questionCount = parseInt(e.target.value);
            qCountDisplay.textContent = questionCount;
            updateQuestionCountLimits();
            updateOtdMax();
        });

        // Timer duration slider
        const timerSlider = document.getElementById('timer-slider');
        const timerDisplay = document.getElementById('timer-display');
        timerSlider.addEventListener('input', (e) => {
            timerDuration = parseInt(e.target.value);
            timerDisplay.textContent = timerDuration;
        });
        
        // Update selected categories
        categoryContainer.addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') {
                selectedCategories = Array.from(categoryContainer.querySelectorAll('input:checked'))
                    .map(cb => cb.value);
                updateQuestionCountLimits();
            }
        });
        
        // Initialize selected categories and fetch live counts from server
        selectedCategories = CATEGORIES;
        fetchCategoryCounts();
        
        // Toggle name field requirement based on host-plays-toggle
        const hostPlaysToggle = document.getElementById('host-plays-toggle');
        const hostNameInput = document.getElementById('host-name');
        hostPlaysToggle.addEventListener('change', () => {
            if (!hostPlaysToggle.checked) {
                hostNameInput.placeholder = 'Admin (optional)';
            } else {
                hostNameInput.placeholder = 'Enter your name';
            }
        });

        // Create room button
        const btnCreateRoom = document.getElementById('btn-create-room');
        btnCreateRoom.addEventListener('click', () => {
            const nameInput = document.getElementById('host-name');
            const hostPlays = document.getElementById('host-plays-toggle')?.checked === true;
            hostName = nameInput.value.trim() || (hostPlays ? '' : 'Admin');

            if (!hostName) {
                showError('Please enter your name');
                return;
            }
            
            if (selectedCategories.length === 0) {
                showError('Please select at least one category');
                return;
            }
            
            // Validate question count
            if (questionCount < 5) {
                showError('Please select at least 5 questions');
                return;
            }
            
            // Disable button to prevent double-clicks
            btnCreateRoom.disabled = true;
            btnCreateRoom.textContent = 'Creating Room...';
            
            // Store settings in sessionStorage
            const bonusFirstCorrect = document.getElementById('bonus-points-toggle')?.checked !== false;
            const hostAsPlayer = document.getElementById('host-plays-toggle')?.checked === true;
            const countdownEnabled = document.getElementById('countdown-toggle')?.checked !== false;
            sessionStorage.setItem('buzzin_settings', JSON.stringify({
                categories: selectedCategories,
                questionCount: questionCount,
                timerDuration: timerDuration,
                hostName: hostName,
                bonusFirstCorrect: bonusFirstCorrect,
                hostAsPlayer: hostAsPlayer,
                offTheDomeCount: offTheDomeCount,
                countdownEnabled: countdownEnabled
            }));
            
            // Wait for socket to be connected before creating room
            if (socket.connected) {
                createRoom();
            } else {
                // Wait for connection
                socket.once('connect', () => {
                    createRoom();
                });
                socket.connect();
            }
        });
        
        function createRoom() {
            // Set name and create room
            socket.emit('player:setName', hostName);
            socket.emit('host:createRoom', { gameType: 'buzzin' });
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }
        
        socket.on('connect', () => {
            console.log('Connected to server');
            // Clear any error messages on successful connection
            const errorEl = document.getElementById('error-message');
            if (errorEl && errorEl.classList.contains('show')) {
                errorEl.classList.remove('show');
            }
        });
        
        socket.on('disconnect', () => {
            // Don't show error immediately - might be reconnecting
            console.log('Disconnected from server');
        });
        
        socket.on('reconnect', () => {
            console.log('Reconnected to server');
        });
        
        socket.on('connect_error', (error) => {
            showError('Connection error. Please check your connection.');
            // Re-enable button if connection fails
            btnCreateRoom.disabled = false;
            btnCreateRoom.textContent = 'Create Room';
        });
        
        socket.on('room:created', (roomState) => {
            // Store game settings for when game starts (already saved above, update with same values)
            sessionStorage.setItem('buzzin_settings', JSON.stringify({
                categories: selectedCategories,
                questionCount: questionCount,
                timerDuration: timerDuration,
                hostName: hostName,
                bonusFirstCorrect: document.getElementById('bonus-points-toggle')?.checked !== false,
                hostAsPlayer: document.getElementById('host-plays-toggle')?.checked === true,
                offTheDomeCount: offTheDomeCount,
                countdownEnabled: document.getElementById('countdown-toggle')?.checked !== false
            }));

            // Store redirect info for the game page
            sessionStorage.setItem('buzzin_redirect', JSON.stringify({
                room: roomState.code,
                name: hostName,
                host: true
            }));

            // Redirect to game page with params in URL (for reconnection via URL)
            const gameUrl = `index.html?room=${roomState.code}&name=${encodeURIComponent(hostName)}&host=true`;
            window.location.replace(gameUrl);
        });
        
        socket.on('room:error', (message) => {
            showError(message);
            // Re-enable button on error
            btnCreateRoom.disabled = false;
            btnCreateRoom.textContent = 'Create Room';
        });
    </script>
</body>
</html>
