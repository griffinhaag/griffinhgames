<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #a0035c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: white;
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .game-card:hover::before {
            transform: translateX(100%);
        }

        .game-card h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .game-card p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .play-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #0066cc, #0088ff);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.2s ease;
            margin: 0 5px;
        }

        .play-button:hover {
            transform: scale(1.05);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .loading {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .game-badge {
            display: inline-block;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                padding: 20px;
            }

            .game-card {
                padding: 20px;
            }

            .game-card h2 {
                font-size: 1.5rem;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .play-button {
                width: 80%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Main Menu</h1>
        <div id="loading" class="loading">Loading games...</div>
        <div id="error" class="error-message" style="display: none;"></div>
        <div class="games-grid" id="games-grid">
            <!-- Static games (always shown) -->
            <div class="game-card">
                <h2>Truth or Griddy</h2>
                <p>An absolute hood classic, can't frickin answer, you griddy on that jon!!</p>
                <div class="button-container">
                    <a href="games/truthOrgriddy/truthOrGriddyindex.html" class="play-button">Play Now</a>
                </div>
            </div>

            <div class="game-card">
                <h2>Kings Dice</h2>
                <p>A cheeky twist on a OD classic card game! Can't frickin answer? GET FUCKED and blow up the balloon!</p>
                <div class="button-container">
                    <a href="games/Kings Dice/kingsdiceindex.html" class="play-button">Classic</a>
                    <a href="games/Kings Dice/custom/custom-kingsdice.html" class="play-button">Custom</a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Use values from config.js (already set on window)
        // Access directly from window to avoid redeclaration errors

        // Fetch games from backend
        async function loadBackendGames() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const gamesGrid = document.getElementById('games-grid');

            try {
                // Use window.BACKEND_URL directly (set by config.js)
                const response = await fetch(`${window.BACKEND_URL}/games`);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch games: ${response.status}`);
                }

                const data = await response.json();
                const games = data.games || [];

                // Hide loading
                loadingEl.style.display = 'none';

                // Render backend games
                games.forEach(game => {
                    const gameCard = createGameCard(game);
                    gamesGrid.appendChild(gameCard);
                });

            } catch (error) {
                console.error('Error loading backend games:', error);
                loadingEl.style.display = 'none';
                
                // Only show error if we're in production (backend should be available)
                if (window.isProduction) {
                    errorEl.textContent = `Unable to connect to game server. ${error.message}`;
                    errorEl.style.display = 'block';
                } else {
                    // In development, silently fail if backend isn't running
                    console.warn('Backend not available. Games will not be loaded dynamically.');
                }
            }
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            // BuzzIn! uses setup.html, others use lobby.html
            const gameUrl = game.id === 'buzzin' 
                ? `games/buzzin/setup.html`
                : `games/multiplayer/lobby.html?game=${game.id}`;
            
            card.innerHTML = `
                <div class="game-icon">${game.icon || '🎮'}</div>
                <span class="game-badge">Multiplayer</span>
                <h2>${game.name}</h2>
                <p>${game.description || 'Join friends for an exciting multiplayer experience!'}</p>
                <div class="button-container">
                    <a href="${gameUrl}" class="play-button">Play Now</a>
                </div>
            `;

            return card;
        }

        // Load backend games on page load
        loadBackendGames();
    </script>
</body>
</html>
